[package]
name = "graph-contracts-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Experiments with graph observations, contracts, and reusable capabilities"
publish = false

[lib]
name = "graph_contracts_poc"

[[bin]]
name = "gcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
